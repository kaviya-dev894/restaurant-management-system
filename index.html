
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍽️ Our Restaurant</h1>
        <p>Delicious Food, Happy Moments!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Food Menu</a>
        <a href="#order">My Order</a>
    </nav>

    <section id="home" class="hero">
        <h2>Welcome to Our Restaurant</h2>
        <p>Enjoy your favourite food with us!</p>
        <button onclick="showMenu()">Explore Menu</button>
    </section>

    <section id="menu">
        <h2>Our Food Menu</h2>
        <div id="food-list"></div>
    </section>

    <section id="order">
        <h2>Your Order</h2>
        <input id="customer" placeholder="Enter Customer Name">
        <div id="cart"></div>
        <h3 id="total">Total: Rs.0</h3>
        <button onclick="placeOrder()">Place Order</button>
        <div id="bill"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
